services:
  file-manager:
    build: .
    container_name: file-manager
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # Default: the Docker MySQL (service data-processing-db, container port 3306).
      # Fallback to Windows MySQL: set MYSQL_HOST=host.docker.internal and MYSQL_PORT=3307 in .env
      MYSQL_HOST: ${MYSQL_HOST:-data-processing-db}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      PROCESSING_MANAGER_URL: http://host.docker.internal:8002
      WATCHFILES_FORCE_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - data_processing_net
    volumes:
      # Live code reload; Source code/Output (converted CSVs and uploads) lives inside this mount
      - ./Source code:/app/Source code

networks:
  data_processing_net:
    name: data_processing_net
    external: true
